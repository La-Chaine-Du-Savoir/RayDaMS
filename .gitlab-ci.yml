stages:
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

variables:
  DOCKER_HOST: unix:///var/run/docker.sock

before_script:
  - apk add --no-cache git
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# TEMPLATE DE BUILD (Mutualisé pour Front, Back et Worker)
.build_image_template:
  image: docker:24.0.6-cli
  stage: build
  timeout: 20 minutes
  retry:
    max: 1
    when: runner_system_failure
  script:
    - |
      TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
      docker build \
        --cache-from "${IMAGE_NAME}:latest" \
        -t "${IMAGE_NAME}:$TAG" \
        -t "${IMAGE_NAME}:latest" \
        -f "$DOCKERFILE_PATH" "$BUILD_CONTEXT"
    - docker push "${IMAGE_NAME}:$TAG"
    - docker push "${IMAGE_NAME}:latest"

# JOBS DE BUILD
build_backend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
    DOCKERFILE_PATH: backend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_TAG'

build_frontend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/front
    DOCKERFILE_PATH: frontend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_TAG'

build_worker:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/worker
    DOCKERFILE_PATH: compiler/Dockerfile
    BUILD_CONTEXT: compiler/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - compiler/**/*
    - if: '$CI_COMMIT_TAG'