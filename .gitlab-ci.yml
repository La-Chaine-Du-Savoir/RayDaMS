stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - apk add --no-cache git
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# TEMPLATE DE BUILD (Mutualisé pour Front, Back et Worker)
.build_image_template:
  image: docker:24.0.6-cli
  stage: build
  timeout: 20 minutes
  retry:
    max: 1
    when: runner_system_failure
  script:
    - |
      TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
      docker build \
        --cache-from "${IMAGE_NAME}:latest" \
        -t "${IMAGE_NAME}:$TAG" \
        -t "${IMAGE_NAME}:latest" \
        -f "$DOCKERFILE_PATH" "$BUILD_CONTEXT"
    - docker push "${IMAGE_NAME}:$TAG"
    - docker push "${IMAGE_NAME}:latest"

# JOBS DE BUILD
build_backend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
    DOCKERFILE_PATH: backend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_TAG'

build_frontend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/front
    DOCKERFILE_PATH: frontend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_TAG'

build_worker:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/worker
    DOCKERFILE_PATH: compiler/Dockerfile
    BUILD_CONTEXT: compiler/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - compiler/**/*
    - if: '$CI_COMMIT_TAG'

# ─── STAGE DEPLOY ─────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache openssh-client bash curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$DEPLOY_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      export TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
      export DEPLOY_URL="ssh://${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}:${DEPLOY_SERVER_PORT:-22}"
      
      ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SERVER_PORT:-22}" "${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}" \
        "cd ${DEPLOY_SERVER_PATH} && \
         export TAG=${TAG} && \
         docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} && \
         docker-compose -f docker-compose.prod.yml pull && \
         docker-compose -f docker-compose.prod.yml up -d && \
         docker system prune -f"
  environment:
    name: production
    url: https://$DEPLOY_SERVER_HOST
  only:
    - main
    - tags
  allow_failure: false

# ─── STAGE ROLLBACK (Manuel) ──────────────────────────────────────────
rollback_production:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$DEPLOY_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SERVER_PORT:-22}" "${DEPLOY_SERVER_USER}@${DEPLOY_SERVER_HOST}" \
        "cd ${DEPLOY_SERVER_PATH} && \
         docker-compose -f docker-compose.prod.yml down && \
         docker-compose -f docker-compose.prod.yml up -d"
  environment:
    name: production
    action: rollback
  only:
    - main
