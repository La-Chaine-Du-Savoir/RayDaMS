stages:
  - lint
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_BUILDKIT: 1

# JOBS DE LINT
lint_frontend:
  image: denoland/deno:alpine-2.7.14
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - deno fmt --check
    - deno lint

lint_backend:
  image: denoland/deno:alpine-2.7.14
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
  script:
    - cd backend
    - deno fmt --check
    - deno lint
    - deno check

# TEMPLATE DE BUILD (Mutualisé pour Front, Back et Worker)
.build_image_template:
  image: docker:24.0.6-cli
  stage: build
  timeout: 20 minutes
  retry:
    max: 1
    when: runner_system_failure
  before_script:
    - apk add --no-cache git
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
      docker build \
        --cache-from "${IMAGE_NAME}:latest" \
        -t "${IMAGE_NAME}:$TAG" \
        -t "${IMAGE_NAME}:latest" \
        -f "$DOCKERFILE_PATH" "$BUILD_CONTEXT"
    - docker push "${IMAGE_NAME}:$TAG"
    - docker push "${IMAGE_NAME}:latest"

# JOBS DE BUILD
build_backend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/api
    DOCKERFILE_PATH: backend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
    - if: '$CI_COMMIT_TAG'

build_frontend:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/front
    DOCKERFILE_PATH: frontend/Dockerfile
    BUILD_CONTEXT: .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
    - if: '$CI_COMMIT_TAG'

build_worker:
  extends: .build_image_template
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/worker
    DOCKERFILE_PATH: compiler/Dockerfile
    BUILD_CONTEXT: compiler/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - compiler/**/*
    - if: '$CI_COMMIT_TAG'

# ─── STAGE DEPLOY ─────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:3.22.4
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
        set -euo pipefail
        cd ~/raydams
        docker compose -f docker-compose.prod.yml pull
        docker compose -f docker-compose.prod.yml up -d
        docker image prune -f
      EOF
  after_script:
    - ssh-agent -k || true
  environment:
    name: production
    url: http://$DEPLOY_HOST
  timeout: 10 minutes


