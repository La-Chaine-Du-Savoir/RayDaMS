services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network
      - external-network

  compiler:
    build:
      context: ./compiler
      dockerfile: Dockerfile
    image: emscripten-raylib-builder:latest
    command: [ "true" ]
    pull_policy: never

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["deno", "task", "worker:start"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USER: ${MINIO_USER}
      S3_PASSWORD: ${MINIO_PASSWORD}
      PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT}
      S3_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
      MAX_CONCURRENT: ${MAX_CONCURRENT}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS}
      PEPPER_SECRET: ${PEPPER_SECRET}
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend-network
      - docker-network

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
    entrypoint: >
      sh -c "
        echo 'BUCKET_NAME = $$MINIO_STORAGE_BUCKET_NAME';
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_STORAGE_BUCKET_NAME;
        echo 'Bucket \"$$MINIO_STORAGE_BUCKET_NAME\" configured successfully.'
      "
    networks:
      - backend-network

  api:
    build:
        context: .
        dockerfile: ./backend/Dockerfile
    command: ["deno", "task", "start", "--proxy"]
    environment:
      ENVIRONMENT: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER_SECRET: ${PEPPER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USER: ${MINIO_USER}
      S3_PASSWORD: ${MINIO_PASSWORD}
      PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT}
      S3_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend-network
      - external-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    environment:
      API_URL: ${API_URL}
    command: ["deno", "task", "start", "--proxy"]
    volumes:
      - ./frontend:/app/frontend
    networks:
      - frontend-network
      - external-network

  caddy:
    image: caddy:2.11.3-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
        - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - external-network

volumes:
  pgdata:
  redis_data:
  miniodata:

networks:
    backend-network:
    frontend-network:
    docker-network:
    external-network: