services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass",
      "${REDIS_PASSWORD}",
      "--save",
      "60",
      "1",
      "--appendonly",
      "yes",
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  compiler:
    image: gitlab.polytech.umontpellier.fr:5050/norman.francois/raydams/worker:latest
    command: ["true"]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      PING: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - docker-network

  worker:
    image: gitlab.polytech.umontpellier.fr:5050/norman.francois/raydams/api:latest
    command: ["deno", "task", "worker:start"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      COMPILER_IMAGE: gitlab.polytech.umontpellier.fr:5050/norman.francois/raydams/worker:latest
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USER: ${MINIO_USER}
      S3_PASSWORD: ${MINIO_PASSWORD}
      PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT}
      S3_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
      MAX_CONCURRENT: ${MAX_CONCURRENT}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS}
      PEPPER_SECRET: ${PEPPER_SECRET}
      DOCKER_HOST: "tcp://docker-proxy:2375"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_healthy
    networks:
      - backend-network
      - docker-network

  minio-init:
    image: minio/mc:RELEASE.2023-03-23T20-03-04Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
    entrypoint: >
      sh -c "
        echo 'BUCKET_NAME = $$MINIO_STORAGE_BUCKET_NAME';
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_STORAGE_BUCKET_NAME;
        echo 'Bucket \"$$MINIO_STORAGE_BUCKET_NAME\" configured successfully.'
      "
    networks:
      - backend-network

  api:
    image: gitlab.polytech.umontpellier.fr:5050/norman.francois/raydams/api:latest
    command: ["deno", "task", "start"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER_SECRET: ${PEPPER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USER: ${MINIO_USER}
      S3_PASSWORD: ${MINIO_PASSWORD}
      PUBLIC_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT}
      S3_STORAGE_BUCKET_NAME: ${MINIO_STORAGE_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend-network

  frontend:
    image: gitlab.polytech.umontpellier.fr:5050/norman.francois/raydams/front:latest
    environment:
      API_URL: ${API_URL}
    command: ["deno", "task", "start"]
    ports:
      - "80:5173"
    restart: unless-stopped
    networks:
      - frontend-network

volumes:
  pgdata:
  redis_data:
  miniodata:

networks:
  backend-network:
  frontend-network:
  docker-network:
    internal: true