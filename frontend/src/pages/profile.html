<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <script defer type="module" src="/scripts/index.js"></script>
    <script defer type="module" src="/scripts/profile.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  </head>
  <body>
    <app-navbar></app-navbar>

    <main>
      <header class="hero">
        <h1 class="site-title">Mon <span class="highlight">Profil</span></h1>
      </header>

      <div class="auth-container" style="padding-top: 0">
        <form class="auth-form" id="profile-form">
          <div id="profile-message"></div>

          <!-- Zone de la photo de profil -->
          <div
            class="form-group"
            style="text-align: center; margin-bottom: 2rem"
          >
            <!-- image par défaut si l'utilisateur n'en a pas -->
            <app-avatar id="avatar-preview" size="large"></app-avatar>

            <br>
            <label for="avatar-input" class="btn-upload"
            >Changer la photo</label>
            <!-- L'input est caché -->
            <input
              type="file"
              id="avatar-input"
              name="avatar"
              accept="image/png, image/jpeg, image/webp"
              style="display: none"
            >
          </div>

          <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input
              type="text"
              id="username"
              name="username"
              disabled
              style="background-color: #eee; cursor: not-allowed"
            >
          </div>

          <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <button type="submit" class="btn-form">
            Enregistrer les modifications
          </button>
        </form>
      </div>
      <div style="text-align: center; margin-top: 2rem">
        <a
          href="#"
          id="toggle-password-link"
          style="color: var(--polytech-blue); font-weight: bold; text-decoration: none"
        >
          Changer de mot de passe ?
        </a>
      </div>

      <div
        class="auth-container"
        id="password-section"
        style="margin-top: 1rem; display: none"
      >
        <form class="auth-form" id="password-form">
          <h2
            style="color: var(--polytech-blue-dark); text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem"
          >
            Sécurité
          </h2>
          <div id="password-message"></div>

          <div class="form-group">
            <label for="old-password">Mot de passe actuel</label>
            <input type="password" id="old-password" required>
          </div>

          <div class="form-group">
            <label for="new-password">Nouveau mot de passe</label>
            <input type="password" id="new-password" required minlength="8">
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" required minlength="8">
          </div>

          <button
            type="submit"
            class="btn-form"
            style="background-color: var(--dams-pink); border-color: var(--dams-pink)"
          >
            Changer le mot de passe
          </button>
        </form>
      </div>
      <section class="user-groups-section" style="margin-top: 4rem">
        <h2 style="color: var(--polytech-blue-dark); margin-bottom: 2rem">
          Mes Groupes
        </h2>

        <div id="groups-container" class="cards-container" style="gap: 2rem">
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
