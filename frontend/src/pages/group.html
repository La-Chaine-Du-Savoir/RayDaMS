<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Groupe - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <link rel="stylesheet" href="/assets/styles/group.css">

    <script type="module" src="/components/game-row.js"></script>
    <script defer type="module" src="/scripts/group.js"></script>
  </head>
  <body>
    <app-navbar></app-navbar>

    <main>
      <header class="hero group-hero">
        <span class="group-label">Groupe</span>

        <div class="group-name-wrapper">
          <h1 class="site-title" id="group-name">
            Chargement...
          </h1>

          <span id="admin-actions"></span>
        </div>
      </header>

      <div class="action-section" style="margin-top: 1rem; margin-bottom: 2rem">
        <div id="edit-group-container" class="auth-container hidden-collapse">
          <form id="edit-group-form" class="auth-form horizontal-form">
            <div
              id="edit-message"
              style="width: 100%; text-align: center; margin-bottom: 10px"
            >
            </div>

            <div class="form-group-horizontal">
              <label for="edit-group-name">Nouveau nom</label>
              <div class="form-row">
                <input
                  type="text"
                  id="edit-group-name"
                  name="edit-group-name"
                  required
                  minlength="3"
                  maxlength="50"
                >
                <button type="submit" class="btn-form">Valider</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div id="error-container" class="auth-container">
        <p id="error-message" class="error-message"></p>
        <a href="/profile" class="btn-form">Retour au profil</a>
      </div>

      <section id="group-content">
        <div class="user-groups-section">
          <div class="invite-section-wrapper">
            <div class="invite-title-wrapper">
              <h2>Membres du groupe</h2>
              <button
                id="invite-btn"
                class="btn-primary"
                title="Générer le lien d'invitation"
              >
                +
              </button>
            </div>

            <div id="invite-link-zone">
              <span
                id="invite-url-text"
                title="Cliquez pour copier à nouveau"
              ></span>
              <span id="invite-success-check" title="Lien copié !">✓</span>
            </div>
          </div>

          <div id="members-container" class="cards-container"></div>
        </div>

        <div class="group-games-section">
          <div id="games-container"></div>
        </div>
      </section>
    </main>

    <app-footer></app-footer>
  </body>
</html>
