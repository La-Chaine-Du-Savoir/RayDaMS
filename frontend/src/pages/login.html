<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <script defer type="module" src="/scripts/index.js"></script>
    <script defer type="module" src="/scripts/login.js"></script>
</head>
<body>

<app-navbar></app-navbar>

<main>
    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <h2>Connexion</h2>

            <div id="errorContainer" class="error-message" style="display: none;"></div>

            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="votre_nom">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-form">Se connecter</button>

            <div class="auth-link">
                Pas encore de compte ? <a href="/register">S'inscrire</a>
            </div>
        </form>
    </div>
</main>

<app-footer></app-footer>

</body>
</html>
