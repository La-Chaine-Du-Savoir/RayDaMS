<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 2rem;
        }

        .auth-form {
            background-color: var(--card-bg);
            border: 6px solid #9e9e9e;
            padding: 3rem 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .auth-form h2 {
            color: var(--polytech-blue);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #9e9e9e;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--polytech-blue);
            box-shadow: 0 0 5px rgba(0, 158, 224, 0.3);
        }

        .btn-form {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--dams-pink);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .btn-form:hover {
            background-color: var(--dams-pink-hover);
            transform: translateY(-2px);
        }

        .auth-link {
            text-align: center;
            color: #666;
        }

        .auth-link a {
            color: var(--polytech-blue);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .auth-link a:hover {
            color: var(--dams-pink);
        }

        .error-message {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="/" class="nav-brand">Ray<span class="highlight">DaMS</span></a>
        <img src="/assets/images/logo-dams.png" alt="Logo DaMS" class="nav-logo">
        <img src="/assets/images/logo-polytech.svg" alt="Logo Polytech" class="nav-logo logo-polytech">

        <div class="nav-separator"></div>

        <a href="#" class="nav-link">Jeux</a>
    </div>
    <div class="nav-right">
        <a href="/pages/login.html" class="btn-outline">Se connecter</a>
        <a href="/pages/register.html" class="btn-primary">S'inscrire</a>
    </div>
</nav>

<main>
    <div class="auth-container">
        <form class="auth-form" id="registerForm">
            <h2>Inscription</h2>

            <div id="errorContainer" class="error-message" style="display: none;"></div>

            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="votre_nom">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-form">S'inscrire</button>

            <div class="auth-link">
                Vous avez déjà un compte ? <a href="/pages/login.html">Se connecter</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <p>Développé avec passion par la Chaine du Savoir :</p>
    <ul class="authors-list">
        <li><a href="https://www.linkedin.com/in/antoine-argaillot/" target="_blank">Antoine Argaillot</a> </li>
        <li><a href="https://www.linkedin.com/in/norman-fran%C3%A7ois/" target="_blank">Norman François</a></li>
        <li><a href="https://www.linkedin.com/in/thibaut-scoto-di-suoccio/" target="_blank">Thibaut Scoto Di Suoccio</a></li>
    </ul>
</footer>

</body>
</html>
