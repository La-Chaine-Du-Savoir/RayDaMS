<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="/" class="nav-brand">Ray<span class="highlight">DaMS</span></a>
        <img src="/assets/images/logo-dams.png" alt="Logo DaMS" class="nav-logo">
        <img src="/assets/images/logo-polytech.svg" alt="Logo Polytech" class="nav-logo logo-polytech">

        <div class="nav-separator"></div>

        <a href="#" class="nav-link">Jeux</a>
    </div>
    <div class="nav-right">
        <a href="/login" class="btn-outline">Se connecter</a>
        <a href="/register" class="btn-primary">S'inscrire</a>
    </div>
</nav>

<main>
    <div class="auth-container">
        <form class="auth-form" id="registerForm">
            <h2>Inscription</h2>

            <div id="errorContainer" class="error-message" style="display: none;"></div>

            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="votre_nom">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-form">S'inscrire</button>

            <div class="auth-link">
                Vous avez déjà un compte ? <a href="/login">Se connecter</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <p>Développé avec passion par la Chaine du Savoir :</p>
    <ul class="authors-list">
        <li><a href="https://www.linkedin.com/in/antoine-argaillot/" target="_blank">Antoine Argaillot</a> </li>
        <li><a href="https://www.linkedin.com/in/norman-fran%C3%A7ois/" target="_blank">Norman François</a></li>
        <li><a href="https://www.linkedin.com/in/thibaut-scoto-di-suoccio/" target="_blank">Thibaut Scoto Di Suoccio</a></li>
    </ul>
</footer>

</body>
</html>
