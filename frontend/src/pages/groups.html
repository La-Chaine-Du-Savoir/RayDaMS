<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration des Groupes - RayDaMS</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <link rel="stylesheet" href="/assets/styles/groups.css">

    <script type="module" src="/components/app-navbar.js"></script>
    <script type="module" src="/components/app-footer.js"></script>
    <script type="module" src="/components/group-widget.js"></script>

    <script defer type="module" src="/scripts/groups.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
</head>
<body>

<app-navbar></app-navbar>

<main>
    <header class="hero">
        <h1 class="site-title">Les <span class="highlight">Groupes</span></h1>
        <p class="description">Gérez les groupes de la plateforme et créez-en de nouveaux.</p>
    </header>

    <div class="action-section">
        <button id="toggle-create-btn" class="btn-create-group">Créer un groupe</button>

        <div id="create-group-container" class="auth-container hidden-collapse">
            <form id="create-group-form" class="auth-form horizontal-form">
                <div id="create-message" style="width: 100%; text-align: center; margin-bottom: 10px;"></div>

                <div class="form-group-horizontal">
                    <label for="group-name">Nom du groupe</label>
                    <div class="form-row">
                        <input type="text" id="group-name" name="group-name" placeholder="Ex: IG3, Polytech..." required minlength="3" maxlength="50">
                        <button type="submit" class="btn-form">Valider</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <section class="user-groups-section" style="margin-top: 3rem;">
        <div id="all-groups-container" class="cards-container" style="gap: 2rem;">
            <p>Chargement des groupes...</p>
        </div>
    </section>
</main>

<app-footer></app-footer>

</body>
</html>
